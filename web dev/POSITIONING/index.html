<!DOCTYPE html>
<html>
<head>
  <title>CSS Position Made Easy</title>
</head>

<body style="font-family: Arial; height:2000px; margin:0;">

<!-- STICKY FIRST -->
<div style="
  background: orange;
  padding: 15px;
  font-weight: bold;
  position: sticky;
  top: 0;
">
STICKY – I stick when you scroll 🧲
</div>

<div style="padding:20px;">
Scroll down ⬇️⬇️⬇️
</div>

<!-- STATIC -->
<div style="
  background: lightgray;
  padding: 15px;
  margin: 20px;
  position: static;
">
STATIC – I don’t move 🧍
</div>

<!-- RELATIVE -->
<div style="
  background: lightgreen;
  padding: 15px;
  margin: 20px;
  position: relative;
  left: 40px;
">
RELATIVE – I move a little 🐢
</div>

<!-- ABSOLUTE -->
<div style="
  background: lightblue;
  padding: 20px;
  margin: 20px;
  position: relative;
">
PARENT BOX 👪

  <div style="
    background: pink;
    padding: 10px;
    position: absolute;
    top: 10px;
    right: 10px;
  ">
  ABSOLUTE – I move inside parent 🚀
  </div>

</div>

<!-- FIXED -->
<div style="
  background: violet;
  padding: 15px;
  font-weight: bold;
  position: fixed;
  bottom: 10px;
  left: 10px;
">
FIXED – I stay on screen 👀
</div>

</body>
</html>
